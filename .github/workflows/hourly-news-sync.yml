name: Hourly News Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest news
        env:
          SITE_URL: https://hulu-zena.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 10 \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron-sync"
